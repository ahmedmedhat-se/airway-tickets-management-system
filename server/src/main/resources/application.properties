spring.datasource.url=jdbc:mysql://localhost:3306/airway_tickets_management_system_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Modern Hibernate setting for MySQL 8+
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

# Tolerate trailing slashes on all endpoints (e.g. /api/flights/ == /api/flights)
spring.mvc.pathmatch.use-suffix-pattern=false
spring.web.mvc.pathmatch.trailing-slash=true

# Serialize LocalDateTime as ISO-8601 string, not a numeric array
spring.jackson.serialization.write-dates-as-timestamps=false
# Deserialize ISO-8601 strings into LocalDateTime correctly
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false
spring.jackson.mapper.default-view-inclusion=false

# Session cookie — lax same-site allows cross-origin requests from localhost:5173
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true